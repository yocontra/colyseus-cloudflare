name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run

  workerd:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination example
      - working-directory: example
        run: |
          npm install --ignore-scripts --no-package-lock
          npm run check
          npm run bundle
      - name: Verify multiplayer and physics using the packed package
        working-directory: example
        run: |
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 > /tmp/colyseus-cloudflare.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; cat /tmp/colyseus-cloudflare.log' EXIT
          curl --silent --show-error --fail --retry 30 --retry-connrefused --retry-max-time 45 \
            'http://127.0.0.1:8787/status?room=readiness'
          npm run smoke
